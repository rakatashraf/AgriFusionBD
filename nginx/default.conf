# FieldShift — single public origin (plan §3).
#   /      → frontend (Nitro SSR, :3000)
#   /api/  → backend  (Django + DRF, :8000)
#   /media/→ static export artifacts
#
# Same-origin is required for secure cookies + CSRF (report §2, §11).

upstream frontend_upstream { server frontend:3000; }
upstream backend_upstream  { server backend:8000; }

server {
    listen 80;
    server_name _;

    client_max_body_size 20m;

    # Security headers
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # --- API ---
    location /api/ {
        proxy_pass http://backend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
    }

    # --- Export artifacts (research downloads) ---
    location /media/ {
        alias /app/media/;
        add_header Content-Disposition "attachment" always;
    }

    # --- Everything else → frontend SSR ---
    location / {
        proxy_pass http://frontend_upstream;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
