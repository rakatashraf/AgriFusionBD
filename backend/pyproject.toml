[project]
name = "fieldshift-backend"
version = "1.0.0"
description = "FieldShift — NASA Space Apps 2026 decision-support backend (Django + DRF + GeoDjango)"
requires-python = ">=3.15"
# Dependencies are pinned in requirements.txt (uv reads it); declared here for
# `uv sync` / tooling discoverability.
dependencies = [
    "Django>=5.2,<6.0",
    "djangorestframework>=3.16",
    "drf-spectacular>=0.28",
    "psycopg[binary]>=3.2",
    "requests>=2.32",
    "shapely>=2.0",
    "celery[redis]>=5.4",
    "pytest>=8.3",
    "pytest-django>=4.9",
    "gunicorn>=23.0",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.dev"
testpaths = ["tests"]
