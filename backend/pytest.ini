[pytest]
; Pure engine tests run without GDAL (config.settings.engine_test omits
; django.contrib.gis). DB-dependent tests (permissions, idempotency, contract)
; run under `config.settings.dev` + PostGIS in Docker — see plan §6. Override
; with DJANGO_SETTINGS_MODULE=config.settings.dev for those.
DJANGO_SETTINGS_MODULE = config.settings.engine_test
python_files = test_*.py *_test.py tests.py
addopts = -ra --strict-markers
filterwarnings =
    ignore::DeprecationWarning
testpaths = tests
